services:
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    networks:
      - streaming-network

  # Redpanda Console - Kafka Web UI
  redpanda-console:
    image: redpandadata/console:latest
    hostname: redpanda-console
    container_name: redpanda-console
    depends_on:
      - kafka-broker
    ports:
      - "8083:8080"  # Console Web UI (mapped to 8083 to avoid conflicts)
    environment:
      - KAFKA_BROKERS=kafka-broker:9092
      - SERVER_LISTENPORT=8080
      - LOGGING_LEVEL=info
    networks:
      - streaming-network

  # Sensor Data Producer - Automatic Kafka Producer
  sensor-data-producer:
    image: python:3.11-slim
    container_name: sensor-data-producer
    depends_on:
      - kafka-broker
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    working_dir: /scripts
    command: ["bash", "-c", "pip install kafka-python && sleep 30 && python sensor-data-producer.py"]
    networks:
      - streaming-network
    restart: on-failure

  # QuestDB - Time Series Database
  questdb:
    image: questdb/questdb:9.2.0
    container_name: questdb
    ports:
      - "9000:9000"   # Web Console
      - "8812:8812"   # PostgreSQL wire protocol
      - "9009:9009"   # InfluxDB line protocol
    environment:
      - QDB_PG_USER=admin
      - QDB_PG_PASSWORD=quest
      - QDB_HTTP_ENABLED=true
      - QDB_PG_ENABLED=true
#    volumes:
#      - questdb-data:/var/lib/questdb
    networks:
      - streaming-network

  # Sensor Data Consumer - Kafka Consumer with QuestDB Analytics
  sensor-data-consumer:
    image: python:3.11-slim
    container_name: sensor-data-consumer
    depends_on:
      - kafka-broker
      - questdb
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    working_dir: /scripts
    command: ["bash", "-c", "pip install quixstreams psycopg2-binary && python sensor-data-consumer.py"]
    environment:
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=8812
      - QUESTDB_USER=admin
      - QUESTDB_PASSWORD=quest
      - QUESTDB_DB=qdb
      - KAFKA_BROKER=kafka-broker:9092
    networks:
      - streaming-network
    restart: on-failure

  # Hourly Total Consumer - Aggregates hourly totals and running max
  hourly-total-consumer:
    image: python:3.11-slim
    container_name: hourly-total-consumer
    depends_on:
      - kafka-broker
      - questdb
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    command: ["bash", "-c", "pip install quixstreams psycopg2-binary && python hourly-total-consumer.py"]
    environment:
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=8812
      - QUESTDB_USER=admin
      - QUESTDB_PASSWORD=quest
      - QUESTDB_DB=qdb
      - KAFKA_BROKER=kafka-broker:9092
      - HOURLY_AVG_TOPIC=hourly_average
      - LATE_THRESHOLD_MIN=10
    networks:
      - streaming-network
    restart: on-failure

  # Grafana - Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Grafana Web UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=questdb-questdb-datasource
    volumes:
#      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - streaming-network

networks:
  streaming-network:
    driver: bridge

