services:
  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-network

  # Kafka
  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
      - ./scripts:/scripts
    networks:
      - bigdata-network

  # Hadoop
  hadoop:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    hostname: hadoop
    container_name: hadoop
    ports:
      - "9870:9870"  # NameNode Web UI
      - "8088:8088"  # ResourceManager Web UI
      - "9000:9000"  # HDFS
      - "8020:8020"  # HDFS IPC
    volumes:
      - ./scripts:/scripts
      - hadoop-data:/opt/hadoop/data
    networks:
      - bigdata-network

  # Spark Master
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    hostname: spark-master
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master port
      - "4040:4040"  # Spark Application UI
    volumes:
      - ./scripts:/scripts
    networks:
      - bigdata-network
    command: /opt/spark/sbin/start-master.sh && tail -f /dev/null

  # Spark Worker
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    hostname: spark-worker
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    ports:
      - "8081:8081"  # Spark Worker Web UI
    volumes:
      - ./scripts:/scripts
    networks:
      - bigdata-network
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null

  # Flink JobManager
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - "8082:8081"  # Flink Web UI (mapped to 8082 to avoid conflict)
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./scripts:/scripts
    networks:
      - bigdata-network
    command: jobmanager

  # Flink TaskManager
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./scripts:/scripts
    networks:
      - bigdata-network
    command: taskmanager

networks:
  bigdata-network:
    driver: bridge

volumes:
  hadoop-data:
