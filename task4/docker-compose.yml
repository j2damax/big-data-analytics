services:
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "bash", "-c", "chmod +x /scripts/create-topics.sh && /scripts/create-topics.sh && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Social Producer - Python app to publish TikTok/Twitter CSVs to Kafka
  social-producer:
    image: python:3.11-slim
    container_name: social-producer
    depends_on:
      kafka-broker:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    volumes:
      - ./scripts:/scripts
      - ./data:/data
    working_dir: /scripts
    environment:
      - KAFKA_BROKER=kafka-broker:9092
      - TWITTER_TOPIC=twitter_posts
      - TIKTOK_TOPIC=tiktok_posts
      - TWITTER_CSV=/data/processed/twitter-dataset.csv
      - TIKTOK_CSV=/data/processed/tiktok-dataset.csv
      - SEND_INTERVAL_MS=50
    command: ["bash", "/scripts/start-producer.sh"]
    networks:
      - streaming-network
    restart: on-failure

  # Redpanda Console - Kafka Web UI
  redpanda-console:
    image: redpandadata/console:latest
    hostname: redpanda-console
    container_name: redpanda-console
    depends_on:
      - kafka-broker
    ports:
      - "8083:8080"  # Console Web UI (mapped to 8083 to avoid conflicts)
    environment:
      - KAFKA_BROKERS=kafka-broker:9092
      - SERVER_LISTENPORT=8080
      - LOGGING_LEVEL=info
    networks:
      - streaming-network

  # Flink JobManager
  flink-jobmanager:
    image: flink:1.20.0-java17
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - "8082:8081"  # Flink Web UI (mapped to 8082 to avoid conflict)
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./java/target:/jars
    networks:
      - streaming-network
    command: jobmanager

  # Flink TaskManager
  flink-taskmanager:
    image: flink:1.20.0-java17
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./java/target:/jars
    networks:
      - streaming-network
    command: taskmanager

networks:
  streaming-network:
    driver: bridge
